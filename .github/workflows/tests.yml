name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests -q
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
      - name: Smoke-test the installed command
        shell: bash
        run: |
          bizbuy init ws && cd ws
          bizbuy run samples/sample_raw_licenses.csv --out-dir data
          bizbuy callsheet data/ranked_with_estimate.csv -n 5 -o data/call_sheet.csv
          bizbuy value samples/sample_pnl.yaml
          bizbuy deals samples/deals -o data/deals.csv
