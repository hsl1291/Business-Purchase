[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bizbuy"
version = "0.2.0"
description = "Find small businesses likely to sell, and value them"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bizbuy = "bizbuy.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["bizbuy*"]

[tool.setuptools.package-data]
bizbuy = ["resources/*.yaml", "resources/*.csv", "resources/samples/*", "resources/samples/deals/*", "gui/*.py"]
