# Sample input for bizbuy/valuation.py.
# Numbers here are illustrative -- an auto repair shop doing roughly
# $700k/year revenue with a single owner-operator.

pnl:
  net_profit: 95000
  owner_compensation: 65000
  add_backs:
    depreciation: 18000
    interest_on_business_debt: 6000
    owners_personal_vehicle: 8000
    one_time_hvac_repair: 4000

deal_assumptions:
  multiple_low: 2.2
  multiple_high: 2.8
  down_payment_pct: 0.10
  annual_rate: 0.115        # SBA 7(a) variable rate ballpark; update to current rate
  term_years: 10
  min_dscr: 1.25
  owner_draw_reserve: 65000 # market-rate salary the buyer must be paid from SDE; lenders test DSCR AFTER this
  # market_manager_salary: 55000   # uncomment to also see an EBITDA figure
  asking_price: 320000       # optional: set to test a specific ask against DSCR

# Your diligence assessment. Feeds bizbuy/scorecard.py to place the business
# inside the multiple band (optional; omit any key you haven't assessed).
risk_factors:
  owner_dependence: high        # low | medium | high
  revenue_trend: flat           # growing | flat | declining
  recurring_revenue: low        # high | medium | low
  financial_records: adequate   # clean | adequate | messy
  top_customer_pct: 0.08        # largest customer's share of revenue
  years_in_business: 27
